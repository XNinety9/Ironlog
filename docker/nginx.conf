# Configuration complète : remplace celle de l'image de base, qui écrit dans /run et /var/log
# (inaccessibles à l'utilisateur non-root de l'image).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        server_tokens off;
        gzip on;
        gzip_min_length 256;
        gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json font/woff font/woff2;

        # Un bloc « types » imbriqué remplace toute la table : on repart donc de mime.types, puis on ajoute.
        include /etc/nginx/mime.types;
        types {
            application/manifest+json webmanifest;
        }

        # En-têtes de sécurité. Pas de connect-src externe : l'app ne parle à aucun serveur.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        # Fichiers du build : noms hachés, donc cacheables indéfiniment.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # Le service worker et la page doivent toujours être revérifiés, sinon une mise à jour ne se voit pas.
        location = /sw.js {
            expires -1;
        }

        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
