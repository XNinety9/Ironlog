# Run locally: docker compose up --build, then open http://localhost:8080
# The service worker (offline use, installation) requires HTTPS, except on localhost.
# Without an SSO proxy in front, the API attributes all data to the IRONLOG_DEV_USER user.
services:
  ironlog:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ironlog:local
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ironlog-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ironlog-api:local
    restart: unless-stopped
    environment:
      - IRONLOG_DEV_USER=local
    volumes:
      # SQLite database kept outside the container. The folder must be writable by the container user.
      - ./.data:/data
    user: "${UID:-1000}:${GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
