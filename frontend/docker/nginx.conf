# Full configuration: replaces the base image's, which writes to /run and /var/log
# (not writable by the image's non-root user).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        server_tokens off;
        gzip on;
        gzip_min_length 256;
        gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json font/woff font/woff2;

        # A nested "types" block replaces the whole table: start from mime.types, then add.
        include /etc/nginx/mime.types;
        types {
            application/manifest+json webmanifest;
        }

        # Security headers. No external connect-src: the app talks to no server other than its own API.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        # Sync API: the "ironlog-api" container on the same Docker network.
        # Resolved per request (Docker resolver): without the API, the site still works and /api returns 502.
        # Identity headers set by the reverse proxy (X-Auth-Request-User) are passed through unchanged.
        location /api/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $api_upstream http://ironlog-api:3000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            client_max_body_size 6m;
        }

        # Build output: hashed file names, so they can be cached indefinitely.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # The service worker and the page must always be revalidated, or updates would not show.
        location = /sw.js {
            expires -1;
        }

        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
